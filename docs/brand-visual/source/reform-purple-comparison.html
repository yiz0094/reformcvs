<div id="reform-purple-comparison">
<style>
#reform-purple-comparison {font-family:'Malgun Gothic',Arial,sans-serif;}
#reform-purple-comparison .compare-grid {display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px;}
#reform-purple-comparison .option-title {color:var(--foreground);font-size:18px;font-weight:500;margin:0 0 8px;}
#reform-purple-comparison .option-code {color:var(--muted-foreground);font-size:12px;margin-bottom:16px;}
#reform-purple-comparison .screen {background:#FFFFFF;color:#303236;border:1px solid #E7E7E7;border-radius:16px;overflow:hidden;--brand-teal:#28594D;}
#reform-purple-comparison .screen * {box-sizing:border-box;}
#reform-purple-comparison .masthead {display:flex;align-items:center;justify-content:space-between;gap:8px;padding:22px 20px;border-bottom:1px solid #EEEEEE;}
#reform-purple-comparison .wordmark {font-size:17px;font-weight:700;letter-spacing:-.06em;white-space:nowrap;}
#reform-purple-comparison .logo-point {display:inline-block;width:11px;height:11px;background:var(--purple-choice);border-radius:4px;margin-right:7px;}
#reform-purple-comparison .nav-text {font-size:11px;color:#28594D;white-space:nowrap;}
#reform-purple-comparison .hero {padding:28px 20px 22px;}
#reform-purple-comparison .tag {display:inline-block;padding:7px 12px;background:var(--purple-choice);color:#303236;border-radius:20px;font-size:12px;font-weight:500;}
#reform-purple-comparison .hero h2 {font-size:31px;line-height:1.3;letter-spacing:-.06em;font-weight:700;margin:18px 0 14px;color:#303236;}
#reform-purple-comparison .highlight {text-decoration:underline;text-decoration-color:var(--purple-choice);text-decoration-thickness:9px;text-underline-offset:-3px;text-decoration-skip-ink:none;}
#reform-purple-comparison .description {font-size:13px;line-height:1.8;color:#5D6064;margin:0;}
#reform-purple-comparison .photo {margin:0 20px;position:relative;border:1px solid #EFEFEF;border-radius:12px;overflow:hidden;background:#fff;}
#reform-purple-comparison .photo img {display:block;width:100%;height:260px;object-fit:contain;}
#reform-purple-comparison .photo-label {position:absolute;left:12px;top:12px;background:var(--purple-choice);color:#303236;font-size:11px;padding:5px 9px;border-radius:14px;}
#reform-purple-comparison .photo-name {font-size:12px;padding:10px 12px;border-top:1px solid #F0F0F0;display:flex;justify-content:space-between;gap:8px;}
#reform-purple-comparison .photo-name span:last-child {color:var(--brand-teal);}
#reform-purple-comparison .actions {padding:18px 20px 22px;}
#reform-purple-comparison .main-action {background:var(--brand-teal);color:#fff;text-align:center;padding:13px;border-radius:9px;font-size:14px;font-weight:500;}
#reform-purple-comparison .sub-action {border:1px solid var(--purple-choice);border-left:5px solid var(--purple-choice);border-radius:9px;padding:12px;margin-top:10px;display:flex;justify-content:space-between;font-size:12px;background:#fff;color:#303236;}
#reform-purple-comparison .selection {margin-top:14px;}
#reform-purple-comparison .status {margin-top:18px;color:var(--foreground);}
@media(max-width:570px){#reform-purple-comparison .compare-grid{grid-template-columns:1fr;}#reform-purple-comparison .photo img{height:290px;}}
</style>

<script>
(()=>{
const root=document.getElementById('reform-purple-comparison');
const template=root.querySelector('#reform-identical-hero');
root.querySelectorAll('.screen').forEach(screen=>screen.appendChild(template.content.cloneNode(true)));
const labels={warm:'붉은 기가 도는 보라',cool:'푸른 기가 도는 보라'};
function select(choice){
 root.querySelectorAll('[data-pick]').forEach(button=>button.setAttribute('aria-pressed',String(button.dataset.pick===choice)));
 root.querySelector('.status').textContent=labels[choice]?labels[choice]+' 선택 · 청록 #28594D 유지':'청록 #28594D · 화이트 #FFFFFF · 차콜 #303236 공통';
}
select(window.openai?.widgetState?.modelContent?.purpleChoice);
root.querySelectorAll('[data-pick]').forEach(button=>button.addEventListener('click',()=>{
const choice=button.dataset.pick; select(choice);
if(window.openai?.setWidgetState)window.openai.setWidgetState({modelContent:{purpleChoice:choice,label:labels[choice],teal:'#28594D'},privateContent:null}).catch(()=>{});
}));
window.addEventListener('openai:set_globals',event=>{const state=event.detail?.globals?.widgetState;if(state)select(state.modelContent?.purpleChoice);});
})();
</script>
